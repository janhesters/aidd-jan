name: AIDD Review (Claude)

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: aidd-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aidd-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          classify_inline_comments: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Your ONLY output should be GitHub comments (inline and summary).
            Do NOT emit review text as plain messages.

            Steps:
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to get the full diff.
            2. Read .claude/skills/aidd-review/SKILL.md and all reference files it
               points to. Execute the review process exactly as the skill defines it.
            3. For file-specific findings, call
               mcp__github_inline_comment__create_inline_comment with the file path,
               line number, your recommendation, and confirmed=true.
               If that tool is unavailable, run:
                 echo "::warning::Inline comment MCP tool unavailable — falling back to summary"
               and include line-level findings in the summary instead.
            4. Post your full review as a summary comment using:
               gh pr comment ${{ github.event.pull_request.number }} --body "<review>"
               Follow the skill's output format. Be thorough — do not abbreviate.
            5. At the very end of the summary comment, add a "Quick fix prompt"
               section with a fenced code block (triple backticks) containing a
               standalone prompt a developer can copy-paste into Claude Code to
               fix all findings:

               ### Quick fix prompt
               ```text
               Fix the following review findings in PR #<number>:
               1. <file>:<line> — <what to fix>
               2. <file>:<line> — <what to fix>
               ...
               ```
          claude_args: |
            --model claude-sonnet-4-6 --max-turns 25 --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(echo:*),mcp__github_inline_comment__create_inline_comment"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-review-log
          path: /home/runner/work/_temp/claude-execution-output.json
