name: AIDD Review (Claude)

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: aidd-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  aidd-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check if review already posted
        id: check-review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json comments --jq '.comments[].body' 2>/dev/null || echo "")
          if echo "$BODY" | grep -q '<!-- aidd-review-posted -->'; then
            echo "Review already posted — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI workflow to pass
        if: steps.check-review.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"

          echo "Waiting for CI workflow to complete for $SHA..."
          for i in $(seq 1 60); do
            RESULT=$(gh run list --repo "$REPO" --commit "$SHA" --workflow ci.yml --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || echo "")

            STATUS=$(echo "$RESULT" | cut -d' ' -f1)
            CONCLUSION=$(echo "$RESULT" | cut -d' ' -f2)

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI workflow passed!"
                exit 0
              else
                echo "CI workflow failed with conclusion: $CONCLUSION"
                exit 1
              fi
            fi

            echo "CI workflow status: ${STATUS:-not started yet} (attempt $i/60)"
            sleep 30
          done

          echo "Timed out waiting for CI workflow"
          exit 1

      - uses: actions/checkout@v6
        if: steps.check-review.outputs.skip != 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.check-review.outputs.skip != 'true'
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          classify_inline_comments: false
          prompt: |
            # Automated PR Review

            Act as a top-tier principal software engineer reviewing PR #${{ github.event.pull_request.number }}
            in ${{ github.repository }}.

            Constraints {
              Post inline comments only — do NOT post a summary comment.
              Do NOT emit review text as plain messages between tool calls.
              A post-processing step extracts your final message as the summary comment.
            }

            ReviewProcess {
              1. Run `gh pr diff ${{ github.event.pull_request.number }}` to get the full diff.
              2. Read .claude/skills/aidd-review/SKILL.md and relevant reference files it
                 points to. Execute the review process exactly as the skill defines it.
              3. For file-specific findings, call
                 mcp__github_inline_comment__create_inline_comment with the file path,
                 line number, recommendation, and confirmed=true.
                 match (tool availability) {
                   case (unavailable or call fails) => run:
                     echo "::warning::Inline comment MCP tool unavailable — falling back to summary"
                   default => post inline comment
                 }
              4. As your FINAL message, write the full review summary in markdown.
                 Follow the skill's output format. Be thorough — do not abbreviate.
                 At the very end, add a "Quick fix prompt" section with a fenced code
                 block (triple backticks) containing a standalone prompt a developer
                 can copy-paste into Claude Code to fix all findings:

                   ### Quick fix prompt
                   ```text
                   Fix the following review findings in PR #<number>:
                   1. <file>:<line> — <what to fix>
                   2. <file>:<line> — <what to fix>
                   ...
                   ```
            }
          claude_args: |
            --model claude-sonnet-4-6 --max-turns 20 --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(echo:*),mcp__github_inline_comment__create_inline_comment" --disallowedTools "Task,Write,Edit"

      - name: Post summary comment
        if: always() && steps.check-review.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG="/home/runner/work/_temp/claude-execution-output.json"
          if [ ! -f "$LOG" ]; then
            echo "::warning::No execution log found — skipping summary comment"
            exit 0
          fi

          # Extract the last assistant message as the summary
          BODY=$(python3 -c "
          import json, sys
          with open('$LOG') as f:
              entries = json.load(f)
          # Walk backwards to find the last assistant text message
          for entry in reversed(entries):
              if entry.get('type') == 'assistant':
                  msg = entry.get('message', {})
                  for block in msg.get('content', []):
                      if block.get('type') == 'text':
                          print(block['text'])
                          sys.exit(0)
          print('Review completed but no summary was generated.')
          ")

          # Post with marker so future runs know a review was already posted
          printf '<!-- aidd-review-posted -->\n%s' "$BODY" | gh pr comment "${{ github.event.pull_request.number }}" --body-file -

      - uses: actions/upload-artifact@v7
        if: always() && steps.check-review.outputs.skip != 'true'
        with:
          name: claude-review-log
          path: /home/runner/work/_temp/claude-execution-output.json
