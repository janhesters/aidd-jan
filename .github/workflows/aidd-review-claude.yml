name: AIDD Review (Claude)

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: aidd-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aidd-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          classify_inline_comments: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a code reviewer. Your ONLY output should be GitHub comments
            (inline and summary). Do NOT emit review text as plain messages.

            Steps:
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to get the full diff.
            2. Read .claude/skills/aidd-review/SKILL.md for the review criteria.
            3. Read all reference files the skill points to (OWASP, JWT security,
               timing-safe compare, implementation guides, etc.).
            4. For each changed file, apply every review criterion from the skill
               and its references.
            5. You MUST call mcp__github_inline_comment__create_inline_comment for
               each file-specific finding. Include the file path, line number, your
               recommendation, and set confirmed=true so the comment posts immediately.
               Do NOT skip this step — every finding that references a specific file
               and line MUST be posted as an inline comment.
               If that tool is not available or the call fails, run:
                 echo "::warning::Inline comment MCP tool unavailable — falling back to summary"
               and include all line-level findings in the summary comment instead.
            6. After reviewing all files, post a single summary comment using:
               gh pr comment ${{ github.event.pull_request.number }} --body "<summary>"
               The summary should list the number of findings by severity, key
               themes, and an overall assessment.
            7. At the very end of the summary comment, include a "Quick fix prompt"
               section with a fenced code block containing a prompt that a developer
               can copy-paste into Claude Code to address all findings. For example:
               ### Quick fix prompt
               ```
               Fix the following review findings in PR #43: ...
               ```
          claude_args: |
            --model claude-opus-4-6 --max-turns 25 --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(echo:*),mcp__github_inline_comment__create_inline_comment"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-review-log
          path: /home/runner/work/_temp/claude-execution-output.json
